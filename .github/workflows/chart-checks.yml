name: Chart checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: pip install PyYAML==6.0.2
      - run: python tests/verify_profiles.py
      - run: python tests/verify_helpers.py
      - run: helm lint charts/fedops --strict --kube-version 1.35.4 -f charts/fedops/tests/static-values.yaml
